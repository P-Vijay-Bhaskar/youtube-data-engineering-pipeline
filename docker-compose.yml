version: '3.9'

services:

  postgres:
    image: postgres:17
    container_name: youtube_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: youtube_pipeline_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  etl:
    build: .

    container_name: youtube_etl

    env_file:
      - scripts/.env

    depends_on:
      - postgres

volumes:
  postgres_data: